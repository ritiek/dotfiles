                      - text: Tech Mahindra employee protests outside campus over alleged termination after availing leave to care for ailing daughter
                      - text: In response, Tech Mahindra said it had connected with the employee and was reviewing the matter with urgency. A software employee staged a protest outside the Tech Mahindra campus in Dundigal on Thursday, alleging that she was arbitrarily terminated after availing three days of sick leave to care for her ailing daughter. The employee, identified as Bhavana, claimed she had been working with the firm for about four-and-a-half months when her services were terminated without prior notice or any valid reason.
                      - text: According to her, she had requested leave to look after her daughter but was instead removed from her job. Bhavana further alleged that the management had earlier harassed her while she was on a 14-day medical leave following a fall on the company premises. She claimed the company repeatedly sent emails asking her to resume work and warned that she would lose her job if she failed to return.
                      - text: Alleging a hostile work environment, Bhavana said she was required to seek permission even to use the washroom.
                      - text: In response to The Hindu’s email, Tech Mahindra said, “We have connected with the employee and are reviewing the matter with urgency. Tech Mahindra is an employee focussed company and we remain committed to the well-being and safety of our employees.”
