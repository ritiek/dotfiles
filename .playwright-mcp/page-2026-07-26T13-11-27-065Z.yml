                      - text: is dead?
                      - text: Companies are now asking a completely different technical question.
                      - text: And most developers are failing it miserably.
                      - text: "\"Tell me about your agentic coding setup.\""
                      - text: If your answer is that you just open a prompt and ask the AI to write the code for you, you will not get hired.
                      - text: Startups are terrified of chaotic vibe coders who generate thousands of lines of code they do not understand.
                      - text: They are looking for engineers who use AI as a structured tool.
                      - text: "Here is how you actually answer this question:"
                      - text: "- Define the Workflow: Do not say the agent does everything. Explain how you use it for the heavy lifting while you maintain architectural control."
                      - text: "- Explain your Governance: Explicitly state your verification loops. The best engineers enforce strict quality gates before any AI generated code is committed."
                      - text: "- Discuss Failure Modes: Have a war story ready. Explain a time the AI hallucinated or got stuck in a loop and how you caught the error."
                      - text: The industry is shifting from writing syntax to orchestrating systems.
                      - text: You are the architect. The AI is your operator.
                      - text: How are you currently managing your agentic workflow?
