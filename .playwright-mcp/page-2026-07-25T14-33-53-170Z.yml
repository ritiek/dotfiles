                  - /url: https://en.wikipedia.org/wiki/Kotlin_(programming_language)
                - text: ", and for"
                - link "iOS" [ref=e656] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/IOS
                - text: both
                - link "Objective-C" [ref=e657] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Objective-C
                - text: and
                - link "Swift" [ref=e658] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Swift_(programming_language)
                - text: .
                - superscript [ref=e659]:
                  - link "[5]" [ref=e660] [cursor=pointer]:
                    - /url: "#cite_note-Chromium_coding_style-5"
                    - generic [ref=e661]: "[5]"
                - superscript [ref=e662]:
                  - link "[4]" [ref=e663] [cursor=pointer]:
                    - /url: "#cite_note-source_code_language_percentages-4"
                    - generic [ref=e664]: "[4]"
              - paragraph [ref=e665]:
                - link "Python" [ref=e666] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Python_(programming_language)
                - text: is the main language of the build system,
                - superscript [ref=e667]:
                  - link "[4]" [ref=e668] [cursor=pointer]:
                    - /url: "#cite_note-source_code_language_percentages-4"
                    - generic [ref=e669]: "[4]"
                - text: which also has special configuration files for Google's GN tool.
                - superscript [ref=e670]:
                  - link "[29]" [ref=e671] [cursor=pointer]:
                    - /url: "#cite_note-29"
                    - generic [ref=e672]: "[29]"
            - region "Logistics" [ref=e673]:
              - generic [ref=e674]:
                - heading "Logistics" [level=3] [ref=e675]
                - generic [ref=e676]:
                  - link "edit":
                    - /url: /w/index.php?title=Chromium_(web_browser)&action=edit&section=9
              - paragraph [ref=e677]:
                - text: The
                - link "bug tracking system" [ref=e678] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Bug_tracking_system
                - text: is a publicly accessible website.
                - superscript [ref=e679]:
                  - link "[30]" [ref=e680] [cursor=pointer]:
                    - /url: "#cite_note-30"
                    - generic [ref=e681]: "[30]"
                - text: Participants are identified by their
                - link "email" [ref=e682] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Email
                - text: addresses.
              - paragraph [ref=e683]:
                - text: The Chromium
                - link "continuous integration" [ref=e684] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Continuous_integration
                - text: system automatically
                - link "builds" [ref=e685] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Build_(software)
                - text: and tests the codebase several times a day.
                - superscript [ref=e686]:
                  - link "[31]" [ref=e687] [cursor=pointer]:
                    - /url: "#cite_note-CI_system-31"
                    - generic [ref=e688]: "[31]"
              - paragraph [ref=e689]:
                - text: Builds are identified by a four-part
                - link "version number" [ref=e690] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Version_number
                - text: that is major.minor.build.patch.
                - superscript [ref=e691]:
                  - link "[32]" [ref=e692] [cursor=pointer]:
                    - /url: "#cite_note-dev-cal-32"
                    - generic [ref=e693]: "[32]"
                - text: This versioning scheme and the
                - link "branch points" [ref=e694] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Branching_(version_control)
                - text: that occur every six to seven weeks are from
                - link "Google Chrome" [ref=e695] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Google_Chrome
                - text: and its
                - link "development cycle" [ref=e696] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Google_Chrome#Release_version_numbers
                - text: .
                - superscript [ref=e697]:
                  - link "[33]" [ref=e698] [cursor=pointer]:
                    - /url: "#cite_note-33"
                    - generic [ref=e699]: "[33]"
          - region "History" [ref=e700]:
            - generic [ref=e701]:
              - heading "History" [level=2] [ref=e702]
              - generic [ref=e703]:
                - link "edit":
                  - /url: /w/index.php?title=Chromium_(web_browser)&action=edit&section=10
            - region "2008 to 2010" [ref=e704]:
              - generic [ref=e705]:
                - heading "2008 to 2010" [level=3] [ref=e706]
                - generic [ref=e707]:
                  - link "edit":
                    - /url: /w/index.php?title=Chromium_(web_browser)&action=edit&section=11
              - paragraph [ref=e708]:
                - link "Google Chrome" [ref=e709] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Google_Chrome
                - text: debuted in September 2008, and along with its release, the Chromium source code was also made available, allowing builds to be constructed from it.
                - superscript [ref=e710]:
                  - link "[1]" [ref=e711] [cursor=pointer]:
                    - /url: "#cite_note-2008_debut-1"
                    - generic [ref=e712]: "[1]"
                - superscript [ref=e713]:
                  - link "[34]" [ref=e714] [cursor=pointer]:
                    - /url: "#cite_note-Paul02Seo08-34"
                    - generic [ref=e715]: "[34]"
                - superscript [ref=e716]:
                  - link "[35]" [ref=e717] [cursor=pointer]:
                    - /url: "#cite_note-Paul11Dec08-35"
                    - generic [ref=e718]: "[35]"
              - paragraph [ref=e719]:
                - text: Upon release, Chrome was criticized for storing a
                - link "user" [ref=e720] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/User_(computing)
                - text: "'s"
                - link "passwords" [ref=e721] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Password
                - text: without the protection of a master password. Google has insisted that a master password provides no real
                - link "security" [ref=e722] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Computer_security
                - text: against knowledgeable
                - link "hackers" [ref=e723] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Hacker
                - text: ", but users argued that it would protect against co-workers or family members borrowing a computer and being able to view stored passwords as"
                - link "plaintext" [ref=e724] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Plaintext
                - text: .
                - superscript [ref=e725]:
                  - link "[36]" [ref=e726] [cursor=pointer]:
                    - /url: "#cite_note-Issue1397-36"
                    - generic [ref=e727]: "[36]"
                - text: "In December 2009, Chromium developer P. Kasting stated: \"A master password was issue 1397. That issue is closed. We will not implement a master password. Not now, not ever. Arguing for it won't make it happen. 'A bunch of people would like it' won't make it happen. Our design decisions are not democratic. You cannot always have what you want.\""
                - superscript [ref=e728]:
                  - link "[37]" [ref=e729] [cursor=pointer]:
                    - /url: "#cite_note-Issue812-37"
                    - generic [ref=e730]: "[37]"
              - figure "An alpha build of Chromium 3 for Linux" [ref=e731]:
                - link [ref=e732] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:File-Chromium-Linux-Alpha.png
                  - img [ref=e733]
                - generic [ref=e734]: An alpha build of Chromium 3 for Linux
              - paragraph [ref=e735]:
                - text: Version 3 was the first
                - link "alpha" [ref=e736] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Alpha_software
                - text: available for
                - link "Linux" [ref=e737] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Linux
                - text: . Chromium soon incorporated native theming for Linux, using the
                - link "GTK+" [ref=e738] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/GTK+
                - text: toolkit to allow it fit into the
                - link "GNOME" [ref=e739] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/GNOME
                - text: desktop environment.
                - superscript [ref=e740]:
                  - link "[38]" [ref=e741] [cursor=pointer]:
                    - /url: "#cite_note-Paul27May09-38"
                    - generic [ref=e742]: "[38]"
                - superscript [ref=e743]:
                  - link "[39]" [ref=e744] [cursor=pointer]:
                    - /url: "#cite_note-Paul05Jun09-39"
                    - generic [ref=e745]: "[39]"
                - superscript [ref=e746]:
                  - link "[40]" [ref=e747] [cursor=pointer]:
                    - /url: "#cite_note-Paul08Jul09-40"
                    - generic [ref=e748]: "[40]"
                - superscript [ref=e749]:
                  - link "[41]" [ref=e750] [cursor=pointer]:
                    - /url: "#cite_note-ChromiumBlog04Jun09-41"
                    - generic [ref=e751]: "[41]"
                - text: Version 3 also introduced
                - link "JavaScript engine" [ref=e752] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/JavaScript_engine
                - text: optimizations and user-selectable themes.
                - superscript [ref=e753]:
                  - link "[42]" [ref=e754] [cursor=pointer]:
                    - /url: "#cite_note-Paul16Sep09-42"
                    - generic [ref=e755]: "[42]"
              - paragraph [ref=e756]:
                - text: Version 6 introduced features for user interface
                - link "minimalism" [ref=e757] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Minimalism_(computing)
                - text: ", as one of Google's goals was to make the browser \"feel lightweight (cognitively and physically) and fast\"."
                - superscript [ref=e758]:
                  - link "[21]" [ref=e759] [cursor=pointer]:
                    - /url: "#cite_note-Chromium_User_Exp-21"
                    - generic [ref=e760]: "[21]"
                - text: The changes were a unified tools menu, no home button by default (although user configurable), a combined reload/stop button, and the bookmark bar deactivated by default. It also introduced an integrated
                - link "PDF" [ref=e761] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/PDF
                - text: reader,
                - link "WebM" [ref=e762] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/WebM
                - text: and
                - link "VP8" [ref=e763] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/VP8
                - text: support for use with
                - link "HTML video" [ref=e764] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/HTML_video
                - text: ", and a smarter"
                - link "URL" [ref=e765] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/URL
                - text: bar.
                - superscript [ref=e766]:
                  - link "[43]" [ref=e767] [cursor=pointer]:
                    - /url: "#cite_note-OMGUbuntu11Jul10-43"
                    - generic [ref=e768]: "[43]"
                - superscript [ref=e769]:
                  - link "[44]" [ref=e770] [cursor=pointer]:
                    - /url: "#cite_note-Gruener11Jul10-44"
                    - generic [ref=e771]: "[44]"
              - paragraph [ref=e772]:
                - text: Version 7 boosted performance to twice that of prior versions via
                - link "hardware acceleration" [ref=e773] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Hardware_acceleration
                - text: .
                - superscript [ref=e774]:
                  - link "[45]" [ref=e775] [cursor=pointer]:
                    - /url: "#cite_note-NakanoAug10-45"
                    - generic [ref=e776]: "[45]"
                - superscript [ref=e777]:
                  - link "[46]" [ref=e778] [cursor=pointer]:
                    - /url: "#cite_note-Gruener17Aug10-46"
                    - generic [ref=e779]: "[46]"
                - superscript [ref=e780]:
                  - link "[47]" [ref=e781] [cursor=pointer]:
                    - /url: "#cite_note-Gruener08Oct10-47"
                    - generic [ref=e782]: "[47]"
              - paragraph [ref=e783]:
                - text: Version 8 focused on improved integration into
                - link "ChromeOS" [ref=e784] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/ChromeOS
                - text: and improved
                - link "cloud" [ref=e785] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Cloud_computing
                - text: features. These include background
                - link "web applications" [ref=e786] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Web_application
                - text: ", host remoting (allowing users centrally to control features and settings on other computers) and cloud printing."
                - superscript [ref=e787]:
                  - link "[47]" [ref=e788] [cursor=pointer]:
                    - /url: "#cite_note-Gruener08Oct10-47"
                    - generic [ref=e789]: "[47]"
              - paragraph [ref=e790]:
                - text: Version 9 introduced a number of features, including a URL bar feature for exposing
                - link "phishing" [ref=e791] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Phishing
                - text: attacks and
                - link "sandboxing" [ref=e792] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Sandbox_(computer_security)
                - text: for the
                - link "Adobe Flash" [ref=e793] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Adobe_Flash
                - text: plug-in. Other additions were the
                - link "WebGL" [ref=e794] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/WebGL
                - text: library and access for the new
                - link "Chrome Web Store" [ref=e795] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Chrome_Web_Store
                - text: .
                - superscript [ref=e796]:
                  - link "[48]" [ref=e797] [cursor=pointer]:
                    - /url: "#cite_note-Bakke11Nov10-48"
                    - generic [ref=e798]: "[48]"
                - superscript [ref=e799]:
                  - link "[49]" [ref=e800] [cursor=pointer]:
                    - /url: "#cite_note-ChromiumBlog01Dec10-49"
                    - generic [ref=e801]: "[49]"
                - superscript [ref=e802]:
                  - link "[50]" [ref=e803] [cursor=pointer]:
                    - /url: "#cite_note-Gruener04Feb11-50"
                    - generic [ref=e804]: "[50]"
            - region "2011" [ref=e805]:
              - generic [ref=e806]:
                - heading "2011" [level=3] [ref=e807]
                - generic [ref=e808]:
                  - link "edit":
                    - /url: /w/index.php?title=Chromium_(web_browser)&action=edit&section=12
              - figure "Chromium logo introduced in 2011[51]" [ref=e809]:
                - link [ref=e810] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Chromium_11_Logo.svg
                  - img [ref=e811]
                - generic [ref=e812]:
                  - text: Chromium logo introduced in 2011
                  - superscript [ref=e813]:
                    - link "[51]" [ref=e814] [cursor=pointer]:
                      - /url: "#cite_note-51"
                      - generic [ref=e815]: "[51]"
              - paragraph [ref=e816]:
                - text: In February, Google announced that it was considering large-scale
                - link "user interface" [ref=e817] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/User_interface
                - text: (UI) changes, including at least partial elimination of the
                - link "URL" [ref=e818] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/URL
                - text: bar, which had been a mainstay of browsers since the early years of
                - link "the Web" [ref=e819] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/The_Web
                - text: . The proposed UI was to be a consolidation of the row of tabs and the row of navigation buttons, the menu, and URL bar into a single row. The justification was freeing up more screen space for
                - link "web page" [ref=e820] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Web_page
                - text: content. Google acknowledged that this would result in URLs not always being visible to the user, that navigation controls and menus may lose their context, and that the resulting single line could be quite crowded.
                - superscript [ref=e821]:
                  - link "[52]" [ref=e822] [cursor=pointer]:
                    - /url: "#cite_note-Gruener20Feb11-52"
                    - generic [ref=e823]: "[52]"
                - text: However, by August, Google decided that these changes were too risky and shelved the idea.
                - superscript [ref=e824]:
                  - link "[53]" [ref=e825] [cursor=pointer]:
                    - /url: "#cite_note-Gruener09Aug11-53"
                    - generic [ref=e826]: "[53]"
              - paragraph [ref=e827]:
                - text: In March, Google announced other directions for the project. Development priorities focused on reducing the size of the
                - link "executable" [ref=e828] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Executable
                - text: ", integrating"
                - link "web applications" [ref=e829] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Web_application
                - text: and
                - link "plug-ins" [ref=e830] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Plug-in_(computing)
                - text: ","
                - link "cloud computing" [ref=e831] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Cloud_computing
                - text: ", and"
                - link "touch" [ref=e832] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Touchscreen
                - text: interface support.
                - superscript [ref=e833]:
                  - link "[54]" [ref=e834] [cursor=pointer]:
                    - /url: "#cite_note-Gruener22Mar11-54"
                    - generic [ref=e835]: "[54]"
                - superscript [ref=e836]:
                  - link "[55]" [ref=e837] [cursor=pointer]:
                    - /url: "#cite_note-Shankland22Mar11-55"
                    - generic [ref=e838]: "[55]"
                - text: Thus a multi-profile button was introduced to the UI, allowing users to log into multiple Google and other accounts in the same browser instance. Other additions were
                - link "malware" [ref=e839] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Malware
                - text: detection and support for hardware-accelerated
                - link "CSS" [ref=e840] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/CSS
                - text: transforms.
                - superscript [ref=e841]:
                  - link "[56]" [ref=e842] [cursor=pointer]:
                    - /url: "#cite_note-Gruener19Apr11-56"
                    - generic [ref=e843]: "[56]"
                - superscript [ref=e844]:
                  - link "[57]" [ref=e845] [cursor=pointer]:
                    - /url: "#cite_note-Paul10Jun11-57"
                    - generic [ref=e846]: "[57]"
              - paragraph [ref=e847]:
                - text: By May, the results of Google's attempts to reduce the file size of Chromium were already being noted. Much of the early work in this area concentrated on shrinking the size of
                - link "WebKit" [ref=e848] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/WebKit
                - text: ", the"
                - link "image" [ref=e849] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Image
                - text: resizer, and the
                - link "Android" [ref=e850] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Android_(operating_system)
                - text: build system.
                - superscript [ref=e851]:
                  - link "[58]" [ref=e852] [cursor=pointer]:
                    - /url: "#cite_note-Bailey04May11-58"
                    - generic [ref=e853]: "[58]"
                - text: Subsequent work introduced a more compact mobile version that reduced the vertical space of the UI.
                - superscript [ref=e854]:
                  - link "[59]" [ref=e855] [cursor=pointer]:
                    - /url: "#cite_note-Paul19May11-59"
                    - generic [ref=e856]: "[59]"
                - superscript [ref=e857]:
                  - link "[60]" [ref=e858] [cursor=pointer]:
                    - /url: "#cite_note-Gruener19May11-60"
                    - generic [ref=e859]: "[60]"
              - paragraph [ref=e860]:
                - text: Other changes in 2011 were
                - link "GPU" [ref=e861] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/GPU
                - text: acceleration on all pages, adding support for the new
                - link "Web Audio API" [ref=e862] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Web_Audio_API
                - text: ", and the"
                - link "Google Native Client" [ref=e863] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Google_Native_Client
                - text: (NaCl) which permits native code supplied by third parties as platform-neutral binaries to be securely executed within the browser itself.
                - superscript [ref=e864]:
                  - link "[61]" [ref=e865] [cursor=pointer]:
                    - /url: "#cite_note-Bailey02Jun11-61"
                    - generic [ref=e866]: "[61]"
                - superscript [ref=e867]:
                  - link "[62]" [ref=e868] [cursor=pointer]:
                    - /url: "#cite_note-Paul18Sep11-62"
                    - generic [ref=e869]: "[62]"
                - text: Google's
                - link "Skia" [ref=e870] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Skia_Graphics_Engine
                - text: graphics library was also made available for all Chromium versions.
                - superscript [ref=e871]:
                  - link "[63]" [ref=e872] [cursor=pointer]:
                    - /url: "#cite_note-Bailey18Sep11-63"
                    - generic [ref=e873]: "[63]"
                - superscript [ref=e874]:
                  - link "[64]" [ref=e875] [cursor=pointer]:
                    - /url: "#cite_note-Bailey22Sep11-64"
                    - generic [ref=e876]: "[64]"
            - region "Since 2012" [ref=e877]:
              - generic [ref=e878]:
                - heading "Since 2012" [level=3] [ref=e879]
                - generic [ref=e880]:
                  - link "edit":
                    - /url: /w/index.php?title=Chromium_(web_browser)&action=edit&section=13
              - figure "The Chromium Material Icon used until 2022" [ref=e881]:
                - link [ref=e882] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Chromium_Material_Icon.svg
                  - img [ref=e883]
                - generic [ref=e884]: The Chromium Material Icon used until 2022
              - paragraph [ref=e885]:
                - text: The sync service added for Google Chrome in 2012 could also be used by Chromium builds.
                - superscript [ref=e886]:
                  - link "[65]" [ref=e887] [cursor=pointer]:
                    - /url: "#cite_note-Mathias15May12-65"
                    - generic [ref=e888]: "[65]"
                - superscript [ref=e889]:
                  - link "[66]" [ref=e890] [cursor=pointer]:
                    - /url: "#cite_note-Paul16May12-66"
                    - generic [ref=e891]: "[66]"
                - text: The same year, a new
                - link "API" [ref=e892] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/API
                - text: for high-quality video and audio communication was added, enabling
                - link "web applications" [ref=e893] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Web_application
                - text: to access the user's
                - link "webcam" [ref=e894] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Webcam
                - text: and
                - link "microphone" [ref=e895] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Microphone
                - text: after asking permission to do so.
                - superscript [ref=e896]:
                  - link "[67]" [ref=e897] [cursor=pointer]:
                    - /url: "#cite_note-Grunberg31Jul12-67"
                    - generic [ref=e898]: "[67]"
                - superscript [ref=e899]:
                  - link "[68]" [ref=e900] [cursor=pointer]:
                    - /url: "#cite_note-Paul31Jul12-68"
                    - generic [ref=e901]: "[68]"
                - text: Then
                - link "GPU" [ref=e902] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/GPU
                - text: accelerated video decoding for
                - link "Windows" [ref=e903] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Microsoft_Windows
                - text: and support for the
                - link "QUIC" [ref=e904] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/QUIC
                - text: protocol were added.
                - superscript [ref=e905]:
                  - link "[69]" [ref=e906] [cursor=pointer]:
                    - /url: "#cite_note-Chrome06Nov12-69"
                    - generic [ref=e907]: "[69]"
                - superscript [ref=e908]:
                  - link "[70]" [ref=e909] [cursor=pointer]:
                    - /url: "#cite_note-70"
                    - generic [ref=e910]: "[70]"
              - paragraph [ref=e911]:
                - text: In 2013, Chromium's modified
                - link "WebKit" [ref=e912] [cursor=pointer]:
