# Replaces the fork's feeds.conf.default (see `src` in image.nix). Upstream
# tracks each feed's master, which made the downloads FOD hash drift between
# two builds an hour apart; pinning commits makes downloadsHash reproducible.
# GitHub mirrors because `^<sha>` does a shallow fetch-by-commit.
# To bump: `git ls-remote https://github.com/openwrt/<feed>.git HEAD`, then
# re-pin downloadsHash.  Bump together with the fork's upstream base: feeds
# and core move packages between each other (libffi went feed -> core in
# Oct 2026), so a feed far ahead of or behind core silently loses packages.
src-git packages https://github.com/openwrt/packages.git^f2aa920111eb5123715af5514921af01fc33e220
src-git luci https://github.com/openwrt/luci.git^618fbc9b7ad2349522340d5cf61ba5e22c938ab1
src-git routing https://github.com/openwrt/routing.git^ea8633da9c461a9bdc62a0323439d31180762e03
src-git telephony https://github.com/openwrt/telephony.git^06feffc2c154993f555b43756ef7db6dd7e58225
src-git video https://github.com/openwrt/video.git^6a3b5fd6e963f41caa73ef4f691e156d467e2894
