# Mirrors boot.kernel.sysctl in modules/net-tuning.nix, which applies bbr/fq
# fleet-wide to the NixOS machines. switchwrt is OpenWrt, so it gets the same
# settings by hand instead.
#
# The cc line is redundant on paper: kmod-tcp-bbr ships its own
# /etc/sysctl.d/12-tcp-bbr.conf setting exactly this, and that file is marked
# "do not edit, changes will be lost on upgrades". It is repeated here so the
# setting is visible in-tree next to the qdisc, and because 91- sorts after
# 12- so this file wins either way.
net.ipv4.tcp_congestion_control=bbr

# bbr requires a pacing qdisc -- upstream's TCP_CONG_BBR Kconfig help says so
# outright. kmod-tcp-bbr does NOT set this; sch_fq comes from kmod-sched.
#
# CAVEAT, same as the one recorded in modules/net-tuning.nix: this replaces
# fq_codel as the default qdisc, giving up CoDel's AQM on traffic this router
# forwards for the household, while bbr only helps flows the router itself
# originates (which is very little). Applied by explicit request. If
# bufferbloat shows up, this is the first line to drop.
net.core.default_qdisc=fq
